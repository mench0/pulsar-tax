name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Тесты поднимают временный PostgreSQL сами: отдельная база не нужна.
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: pulsar-tax-jar
          path: app/target/pulsar-tax.jar
          retention-days: 7
