<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulsar Tax</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="4" />
        <circle cx="16" cy="16" r="9" fill="none" stroke-width="2" />
        <circle cx="16" cy="16" r="14" fill="none" stroke-width="1.5" opacity=".5" />
      </svg>
      <span class="brand-name">Pulsar <b>Tax</b></span>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="topbar-controls" id="topbar-controls"></div>
  </header>

  <main id="app" aria-live="polite"></main>

  <div id="toast" class="toast" role="status" hidden></div>

  <footer class="footer" id="footer"></footer>

  <script type="module" src="app.js"></script>
</body>
</html>
