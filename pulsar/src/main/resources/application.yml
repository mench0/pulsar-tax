# Настройки Pulsar Tax. Все значения можно задать переменными окружения (README).
server:
  port: ${PULSAR_PORT:8080}
  address: ${PULSAR_HOST:127.0.0.1}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: pulsar-tax
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  datasource:
    # Пусто — встроенный PostgreSQL в PULSAR_DATA_DIR/pg (разработка). На сервере — адрес настоящей базы.
    url: ${PULSAR_DB_URL:}
    username: ${PULSAR_DB_USER:}
    password: ${PULSAR_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # схему меняет только Flyway; Hibernate проверяет, что сущности ей соответствуют
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    deserialization:
      use-big-decimal-for-floats: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

pulsar:
  data-dir: ${PULSAR_DATA_DIR:data}
  signup: ${PULSAR_SIGNUP:open}
  secure-cookie: ${PULSAR_SECURE_COOKIE:false}
  cookie-same-site: ${PULSAR_COOKIE_SAMESITE:Strict}
  allowed-origins: ${PULSAR_ALLOWED_ORIGINS:}
  telegram-token: ${PULSAR_TELEGRAM_TOKEN:}
  telegram-api: https://api.telegram.org
  cba-url: ${PULSAR_CBA_URL:https://api.cba.am/exchangerates.asmx}
  # Путь к папке данных старой версии (users.json и users/*.json) — перенос в базу при запуске.
  import-legacy: ${PULSAR_IMPORT_LEGACY:}

logging:
  level:
    root: INFO
    org.hibernate.orm.deprecation: WARN
