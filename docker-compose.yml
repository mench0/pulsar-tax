# Инфраструктура для разработки (как в проекте test): docker compose up -d
# API запускается отдельно: из IDE или java -jar app/target/pulsar-tax.jar.
services:
  postgres:
    image: "postgres:17-alpine"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=pulsar
      - POSTGRES_USER=pulsar
      - POSTGRES_PASSWORD=${PULSAR_DB_PASSWORD:-pulsar}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsar -d pulsar"]
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  postgres-data:
